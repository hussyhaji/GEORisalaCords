<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Risala Coordinates Map</title>

<!-- ============================================================
     LIBRARIES
     OpenLayers v8 (map engine) + PapaParse (CSV parser), both CDN.
     ============================================================ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- Font: Amiri for all UI and map labels -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS
   A soft pastel "card UI" palette: lavender / mint / blush,
   sitting on top of a dark satellite basemap for contrast.
   ============================================================ */
:root{
  --lavender:      #E7E2FB;
  --lavender-deep: #8B7FD1;
  --mint:          #D8F5E9;
  --mint-deep:     #4FAE8C;
  --blush:         #FDE2E7;
  --blush-deep:    #E2789A;
  --cream:         #FBF9F6;
  --ink:           #2E2A3D;
  --ink-soft:      #6B657F;
  --panel-bg:      rgba(251, 249, 246, 0.94);
  --radius-lg:     22px;
  --radius-md:     14px;
  --radius-sm:     10px;
  --shadow-soft:   0 12px 32px rgba(46, 42, 61, 0.18);
  --font-display:  'Amiri', serif;
  --font-body:     'Amiri', serif;
  --glass-bg:      rgba(255, 252, 247, 0.76);
  --glass-border:  rgba(255, 255, 255, 0.46);
  --toolbar-shadow: 0 20px 44px rgba(15, 23, 42, 0.22);
  --accent-teal:   #0F8B8D;
  --accent-gold:   #D4A017;
}

*{ box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: var(--font-body);
  color: var(--ink);
  overflow: hidden;
}

body::before{
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at top left, rgba(15,139,141,0.18), transparent 30%),
    radial-gradient(circle at top right, rgba(212,160,23,0.16), transparent 28%),
    linear-gradient(180deg, rgba(255,255,255,0.05), transparent 26%);
  pointer-events: none;
  z-index: 1;
}

body.risala-mode::before{
  background: #ffffff;
}

#map{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #0d1117;
  z-index: 2;
  pointer-events: auto;
}

#top-toolbar,
#layer-panel,
#risala-mode-panel,
#layers-toggle-btn,
#feature-popup{
  z-index: 30;
}

/* Cursor states driven by JS: default vs pointer-over-feature */
#map.feature-hover{ cursor: pointer; }

/* ============================================================
   LOADING OVERLAY (shown while CSV is fetched / parsed)
   ============================================================ */
#loading-overlay{
  --l-ink:#3a2814; --l-ink2:#5b4125; --l-lapis:#1f3a5f; --l-teal:#1d5c5a;
  --l-madder:#8c2f23; --l-gold:#b8862b; --l-gold2:#e2b857;
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #ead9ab, #d9be84 60%, #b8985c);
  color: var(--l-ink);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  font-family: var(--font-display);
  z-index: 50;
  overflow: hidden;
  transition: opacity 0.4s ease;
}
#loading-overlay.hidden{ opacity: 0; pointer-events: none; }
.ld-stage{ position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; padding: 1.5rem; animation: ld-rise .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes ld-rise{ from{ opacity: 0; transform: translateY(28px) scale(.97); } to{ opacity: 1; transform: none; } }

/* background scene: vignette, graticule, routes, pins, astrolabe, corner readouts */
.ld-parch{
  position: absolute; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(70,40,12,.55) 100%),
    radial-gradient(circle at 18% 22%, rgba(255,244,210,.55), transparent 38%),
    radial-gradient(circle at 82% 78%, rgba(150,100,40,.35), transparent 40%),
    repeating-linear-gradient(47deg, rgba(120,80,30,.035) 0 2px, transparent 2px 5px);
  animation: ld-breathe 14s ease-in-out infinite alternate;
}
@keyframes ld-breathe{ from{ filter: brightness(1); } to{ filter: brightness(1.07) saturate(1.08); } }
.ld-world{ position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
.ld-grat{ fill: none; stroke: var(--l-ink2); stroke-opacity: .32; stroke-width: .9; transform-box: fill-box; transform-origin: center; animation: ld-drift 90s linear infinite; }
.ld-grat .eq{ stroke: var(--l-madder); stroke-opacity: .55; stroke-width: 1.4; }
.ld-grat .mer0{ stroke: var(--l-lapis); stroke-opacity: .5; stroke-width: 1.3; }
@keyframes ld-drift{
  from{ transform: rotate(0) scale(1.05); } 50%{ transform: rotate(180deg) scale(1.18); } to{ transform: rotate(360deg) scale(1.05); }
}
.ld-route path{ fill: none; stroke: var(--l-madder); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 3 9; animation: ld-march 14s linear infinite; opacity: .7; }
.ld-route path + path{ stroke: var(--l-teal); animation-duration: 20s; animation-direction: reverse; }
@keyframes ld-march{ to{ stroke-dashoffset: -240; } }
.ld-pin circle{ fill: var(--l-madder); opacity: .85; }
.ld-pin .halo{ fill: none; stroke: var(--l-madder); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: ld-ping 3.2s ease-out infinite; }
.ld-pin text{ font-family: 'Amiri', serif; font-size: 15px; fill: var(--l-ink); text-anchor: middle; }
@keyframes ld-ping{ 0%{ transform: scale(.4); opacity: .9; } 100%{ transform: scale(2.6); opacity: 0; } }
.ld-astro{
  position: absolute; z-index: 2; pointer-events: none; top: 50%; left: 50%;
  width: min(130vmin, 1100px); aspect-ratio: 1; transform: translate(-50%, -50%); opacity: .9;
}
.ld-ring circle{ fill: none; stroke: var(--l-gold); stroke-width: 1.6; }
.ld-ring-outer circle:nth-child(2){ stroke: var(--l-ink2); stroke-width: .8; stroke-dasharray: 1 5; }
.ld-ring-mid circle{ stroke: var(--l-teal); stroke-opacity: .7; stroke-dasharray: 14 6 2 6; }
.ld-ring text{ font-family: 'Amiri', serif; font-size: 19px; fill: var(--l-ink2); text-anchor: middle; dominant-baseline: middle; }
.ld-ring-outer{ transform-box: fill-box; transform-origin: center; animation: ld-spin 140s linear infinite; }
.ld-ring-mid{ transform-box: fill-box; transform-origin: center; animation: ld-spin 90s linear infinite reverse; }
.ld-rose{ transform-box: fill-box; transform-origin: center; animation: ld-spin 220s linear infinite; }
.ld-rose .pt{ fill: var(--l-ink); fill-opacity: .12; stroke: var(--l-ink2); stroke-width: 1; }
.ld-rose .pt.a{ fill: var(--l-madder); fill-opacity: .2; }
.ld-rose .pt.b{ fill: var(--l-lapis); fill-opacity: .18; }
.ld-corner{
  position: absolute; z-index: 3; font-family: 'Amiri', serif; font-size: 13px; letter-spacing: .06em;
  color: var(--l-ink2); padding: .5rem .8rem; line-height: 1.7; pointer-events: none; direction: ltr;
}
.ld-corner::before{ content: ""; position: absolute; width: 26px; height: 26px; border: 2px solid var(--l-gold); }
.ld-tl{ top: 10px; left: 10px; } .ld-tl::before{ top: 0; left: 0; border-right: 0; border-bottom: 0; }
.ld-tr{ top: 10px; right: 10px; text-align: right; } .ld-tr::before{ top: 0; right: 0; border-left: 0; border-bottom: 0; }
.ld-bl{ bottom: 10px; left: 10px; } .ld-bl::before{ bottom: 0; left: 0; border-right: 0; border-top: 0; }
.ld-br{ bottom: 10px; right: 10px; text-align: right; } .ld-br::before{ bottom: 0; right: 0; border-left: 0; border-top: 0; }
.ld-corner span{ opacity: .55; }
@media (max-width: 560px){ .ld-corner{ display: none; } }

.ld-seal{ width: 104px; height: 104px; margin-bottom: 1rem; filter: drop-shadow(0 3px 4px rgba(58,40,20,.35)); }
.ld-seal svg{ width: 100%; height: 100%; overflow: visible; }
.ld-ring-s{ fill: #f6ebc6; stroke: var(--l-gold); stroke-width: 3; }
.ld-ring-s.thin{ fill: none; stroke: var(--l-ink); stroke-width: 1; }
.ld-ticks path{ stroke: var(--l-ink); stroke-width: 1.6; fill: none; }
.ld-ticks .minor{ stroke-width: 1; stroke: var(--l-ink2); }
.ld-card{ transform-box: fill-box; transform-origin: center; animation: ld-spin 40s linear infinite reverse; }
.ld-v{ fill: var(--l-lapis); fill-opacity: .25; stroke: var(--l-lapis); stroke-width: .8; }
.ld-h{ fill: var(--l-teal); fill-opacity: .22; stroke: var(--l-teal); stroke-width: .8; }
.ld-needle{ transform-box: fill-box; transform-origin: center; animation: ld-seek 5s ease-in-out infinite; }
.ld-n{ fill: var(--l-madder); stroke: var(--l-ink); stroke-width: .8; }
.ld-s{ fill: #f3e6bd; stroke: var(--l-ink); stroke-width: .8; }
.ld-c{ fill: var(--l-gold2); stroke: var(--l-ink); stroke-width: 1; }
.ld-dot{ fill: var(--l-ink); }
@keyframes ld-spin{ to{ transform: rotate(360deg); } }
@keyframes ld-seek{
  0%{ transform: rotate(0); } 25%{ transform: rotate(110deg); } 40%{ transform: rotate(80deg); }
  70%{ transform: rotate(250deg); } 85%{ transform: rotate(225deg); } 100%{ transform: rotate(360deg); }
}
.ld-text{ font-size: 1.3rem; font-weight: 700; color: var(--l-ink); }
.ld-dots span{ animation: ld-blink 1.4s infinite both; }
.ld-dots span:nth-child(2){ animation-delay: .2s; }
.ld-dots span:nth-child(3){ animation-delay: .4s; }
@keyframes ld-blink{ 0%,80%,100%{ opacity: .15; } 40%{ opacity: 1; } }
.ld-bar{
  position: relative; height: 14px; width: min(340px, 80vw); margin-top: 1rem; direction: ltr;
  background: rgba(58,40,20,.12); border: 2px solid var(--l-ink); border-radius: 8px;
  box-shadow: inset 0 2px 4px rgba(58,40,20,.35), 0 0 0 3px rgba(184,134,43,.35); overflow: hidden;
}
.ld-fill{
  height: 100%; width: 0; border-radius: 6px;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 8px, transparent 8px 16px),
    linear-gradient(90deg, var(--l-madder), var(--l-gold2));
  background-size: 32px 32px, 100% 100%;
  animation: ld-bar 1s linear infinite;
  transition: width .25s ease-out;
}
@keyframes ld-bar{ to{ background-position: 32px 0, 0 0; } }
.ld-pct{ margin-top: .6rem; font-size: 1rem; color: var(--l-ink2); direction: ltr; }
@media (prefers-reduced-motion: reduce){
  #loading-overlay *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}

/* ============================================================
   TOP TOOLBAR
   ============================================================ */
#top-toolbar{
  position: absolute;
  top: 20px;
  left: 20px;
  right: 20px;
  z-index: 26;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  pointer-events: none;
}

#top-toolbar:has(.map-search-results.open){
  z-index: 35;
}

.toolbar-cluster{
  pointer-events: auto;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--glass-bg);
  backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: var(--toolbar-shadow);
}

.map-search{
  position: relative;
  width: min(100%, 460px);
  direction: rtl;
}

.map-search-input-wrap{
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding: 0 13px;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(46, 42, 61, 0.1);
  border-radius: 15px;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.map-search:focus-within .map-search-input-wrap{
  border-color: rgba(15, 139, 141, 0.55);
  box-shadow: 0 10px 24px rgba(15, 139, 141, 0.16);
}

.map-search-icon{
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  color: var(--accent-teal);
}

.map-search-input{
  min-width: 0;
  flex: 1 1 auto;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: 700 14px var(--font-body);
  text-align: right;
}

.map-search-input::placeholder{ color: var(--ink-soft); }
.map-search-input:disabled{ cursor: wait; opacity: 0.55; }

.map-search-clear{
  display: none;
  border: 0;
  padding: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--lavender);
  color: var(--ink-soft);
  font: 16px/1 var(--font-body);
  cursor: pointer;
}

.map-search.has-value .map-search-clear{ display: inline-flex; align-items: center; justify-content: center; }

.map-search-results{
  position: absolute;
  top: calc(100% + 7px);
  left: 0;
  right: 0;
  display: none;
  max-height: 260px;
  overflow-y: auto;
  padding: 6px;
  background: rgba(255, 252, 247, 0.98);
  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 14px;
  box-shadow: 0 16px 34px rgba(15, 23, 42, 0.22);
  z-index: 40;
}

.map-search-results.open{ display: block; }

.map-search-option{
  display: block;
  width: 100%;
  padding: 9px 11px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink);
  font: 700 14px var(--font-body);
  text-align: right;
  cursor: pointer;
}

.map-search-option:hover,
.map-search-option:focus-visible{ background: var(--lavender); outline: 0; }

.map-search-empty{
  padding: 10px 11px;
  color: var(--ink-soft);
  font-size: 13px;
  text-align: right;
}

.toolbar-brand{
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.toolbar-brand .eyebrow{
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(46, 42, 61, 0.62);
}

.toolbar-brand .title{
  font-family: var(--font-display);
  font-size: 19px;
  line-height: 1;
  color: var(--ink);
  white-space: nowrap;
}

.toolbar-actions{
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.toolbar-btn{
  border: none;
  border-radius: 16px;
  padding: 11px 16px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  direction: rtl;
  text-align: right;
  text-decoration: none;
  transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease, color 0.22s ease;
}

.toolbar-btn .btn-icon{
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.toolbar-btn .btn-icon svg{
  width: 100%;
  height: 100%;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.85;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.toolbar-btn:hover{
  transform: translateY(-1px);
}

#measure-toggle-btn{
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(231,226,251,0.96));
  color: var(--ink);
  box-shadow: inset 0 0 0 1px rgba(139,127,209,0.1);
  min-height: 44px;
}

#risala-mode-btn{
  background: linear-gradient(135deg, #0F8B8D, #126E82);
  color: #fff;
  box-shadow: 0 8px 18px rgba(15, 139, 141, 0.24);
  min-height: 44px;
}

#old-maps-btn{
  background: linear-gradient(135deg, #D4A017, #B87914);
  color: #fff;
  box-shadow: 0 8px 18px rgba(212, 160, 23, 0.24);
  min-height: 44px;
}

#risala-mode-btn.is-active{
  background: linear-gradient(135deg, #D4A017, #B87914);
}

#measure-toggle-btn.is-active{
  background: linear-gradient(135deg, rgba(139,127,209,0.96), rgba(15,139,141,0.92));
  color: #fff;
}

.measure-tooltip{
  padding: 7px 10px;
  border-radius: 10px;
  background: rgba(255, 252, 247, 0.96);
  color: var(--ink);
  box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
  border: 1px solid rgba(255,255,255,0.6);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  direction: ltr;
  white-space: normal;
  line-height: 1.3;
  backdrop-filter: blur(14px);
}

.measure-tooltip-line{
  display: flex;
  align-items: baseline;
  justify-content: flex-start;
  gap: 4px;
}

.measure-tooltip-line + .measure-tooltip-line{
  margin-top: 2px;
}

.measure-tooltip-label{
  color: var(--ink-soft);
  flex-shrink: 0;
}

.measure-tooltip-values{
  text-align: left;
  direction: ltr;
}

/* ============================================================
   LAYER CONTROL PANEL — floating, top-right
   ============================================================ */
#layer-panel{
  position: absolute;
  left: 20px;
  bottom: 86px;
  width: 300px;
  max-height: calc(100vh - 180px);
  overflow-y: auto;
  background: rgba(251, 249, 246, 0.94);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.48);
  border-radius: var(--radius-lg);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.22);
  padding: 18px 18px 14px;
  z-index: 20;
  font-family: var(--font-body);
  transition: transform 0.28s ease, opacity 0.28s ease;
}
#layer-panel h3{
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
#layer-panel h3::before{
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--lavender-deep);
  display: inline-block;
}
#risala-mode-panel{
  position: absolute;
  top: auto;
  bottom: 20px;
  left: 20px;
  width: 238px;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(15, 139, 141, 0.16);
  border-radius: 16px;
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
  padding: 14px;
  z-index: 20;
  opacity: 0;
  transform: translateY(-8px) scale(0.98);
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
body.risala-mode #risala-mode-panel{
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
body.risala-mode #layers-toggle-btn{
  display: none;
}
body.risala-mode #layer-tree .geo-places-now-group{
  display: none;
}
#risala-mode-panel h3{
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 15px;
}
.layer-row{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  font-size: 13.5px;
}
.layer-group + .layer-group{ margin-top: 4px; }
.layer-row.parent{
  font-weight: 600;
  border-top: 1px solid rgba(46,42,61,0.08);
  margin-top: 6px;
  padding-top: 10px;
}
.layer-row.child{
  padding-left: 22px;
  color: var(--ink-soft);
}
.layer-row.has-children label{ flex: 1; }
.group-collapse-btn{
  border: none;
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--font-body);
  font-size: 12px;
  width: 20px;
  height: 20px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.group-collapse-btn:hover{ background: rgba(139,127,209,0.16); color: var(--ink); }
.layer-group-children{ overflow: hidden; }
.layer-group.collapsed .layer-group-children{ display: none; }
.layer-row input[type="checkbox"]{
  accent-color: var(--lavender-deep);
  width: 16px; height: 16px;
  cursor: pointer;
  flex-shrink: 0;
}
.layer-row .swatch{
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.15);
}
.layer-row label{ cursor: default; user-select: none; }

/* ============================================================
   RIGHT DIALOGUE BOX — sliding "card UI" popup
   ============================================================ */
#feature-popup{
  position: absolute;
  top: 24px;
  right: 24px;
  bottom: 24px;
  width: min(460px, 34vw);
  transform: translateX(calc(100% + 32px));
  transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 30;
  pointer-events: none;
}
#feature-popup.open{
  transform: translateX(0);
  pointer-events: auto;
}

.popup-shell{
  background: var(--cream);
  border-radius: var(--radius-lg);
  box-shadow: 0 24px 48px rgba(15, 23, 42, 0.24);
  padding: 18px 18px 16px;
  position: relative;
  direction: rtl;
  text-align: right;
  height: 100%;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(255,255,255,0.62);
}

.popup-close{
  position: absolute;
  top: 12px;
  right: 12px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: var(--blush);
  color: var(--blush-deep);
  font-size: 15px;
  font-family: var(--font-body);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, background 0.15s ease;
}
.popup-close:hover{ transform: scale(1.1); background: var(--blush-deep); color: #fff; }

/* Small SubLayer chip card (color set from selected layer) */
.popup-sublayer-card{
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  color: #ffffff;
  box-shadow: 0 6px 16px rgba(46, 42, 61, 0.18);
}

.popup-sublayer-card .popup-sublayer{
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 0;
  color: inherit;
  align-self: center;
}

/* Header card: Name (prominent) */
.popup-header{
  background: var(--lavender);
  border-radius: var(--radius-md);
  padding: 12px 46px 14px 16px;
  margin-bottom: 12px;
  border-left: 6px solid var(--lavender-deep);
}
.popup-header .popup-name{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--ink);
  margin: 0 0 2px;
  line-height: 1.2;
  text-align: center;
}
.popup-header .popup-sublayer{
  display: none;
}

/* Middle row: 3 equal mini-cards */
.popup-minirow{
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
.mini-card{
  flex: 1 1 50%;
  background: var(--mint);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  min-width: 0;
}
.mini-card:nth-child(2){ background: var(--lavender); }
.mini-card .mini-label{
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
  color: var(--ink-soft);
  margin: 0 0 4px;
}
.mini-card .mini-value{
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  margin: 0;
  overflow-wrap: break-word;
  font-family: var(--font-body);
}

/* Bottom row: wide Information card */
.popup-info-card{
  background: #fff;
  border: 1px solid rgba(46,42,61,0.08);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.popup-info-card .mini-label{
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
  color: var(--ink-soft);
  margin: 0 0 6px;
}
.popup-info-card p{
  margin: 0;
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink);
  min-height: 0;
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

/* Scrollbar polish for panel & popup */
#layer-panel::-webkit-scrollbar, .popup-info-card p::-webkit-scrollbar{ width: 6px; }
#layer-panel::-webkit-scrollbar-thumb, .popup-info-card p::-webkit-scrollbar-thumb{
  background: var(--lavender-deep); border-radius: 4px;
}

/* Layers toggle button (desktop text, mobile hamburger) */
#layers-toggle-btn{
  position: absolute;
  left: 20px;
  bottom: 20px;
  z-index: 25;
  border: none;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.96);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  padding: 12px 14px;
  box-shadow: 0 12px 26px rgba(15, 23, 42, 0.24);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 132px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#layers-toggle-btn:hover{
  transform: translateY(-1px);
  box-shadow: 0 16px 30px rgba(15, 23, 42, 0.28);
}

#layers-toggle-btn .hamburger{
  display: none;
  width: 16px;
  height: 12px;
  flex-direction: column;
  justify-content: space-between;
}

#layers-toggle-btn .hamburger span{
  width: 100%;
  height: 2px;
  border-radius: 2px;
  background: var(--ink);
  display: block;
}

/* Climate boundaries toggle inside toolbar */
#boundaries-toggle-btn{
  position: static;
  z-index: auto;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(216,245,233,0.96));
  color: var(--ink);
  box-shadow: inset 0 0 0 1px rgba(15,139,141,0.08);
  min-height: 44px;
}

#boundaries-toggle-btn::before{
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent-teal);
  box-shadow: 0 0 0 0 rgba(79,174,140,0.45);
  transition: background 0.25s ease, box-shadow 0.4s ease;
}

#boundaries-toggle-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 16px 36px rgba(15, 23, 42, 0.22);
}

#boundaries-toggle-btn.is-active{
  background: linear-gradient(135deg, rgba(15,139,141,0.96), rgba(212,160,23,0.92));
  color: #fff;
}

#boundaries-toggle-btn.is-active::before{
  background: #ffffff;
  box-shadow: 0 0 0 8px rgba(255,255,255,0.2);
}

body.layers-hidden #layer-panel{
  transform: translateY(16px) scale(0.98);
  opacity: 0;
  pointer-events: none;
}

@media (max-width: 640px), (max-height: 600px) and (max-width: 1024px){
  .popup-minirow{
    flex-direction: row;
    gap: 8px;
  }
}

@media (max-width: 768px), (max-height: 600px) and (max-width: 1024px){
  html,
  body{
    overscroll-behavior: none;
  }

  #map,
  #map .ol-viewport{
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  #map *::selection{
    background: transparent;
  }

  #top-toolbar{
    top: 14px;
    left: 12px;
    right: 12px;
    transform: none;
    align-items: stretch;
  }

  .toolbar-cluster{
    width: 100%;
    min-width: 0;
    max-width: 100%;
    align-items: stretch;
    justify-content: flex-start;
    gap: 7px;
    padding: 7px 8px;
  }

  .toolbar-brand{ display: none; }

  .toolbar-brand .eyebrow{ display: none; }
  .toolbar-brand .title{ font-size: 17px; }

  .toolbar-actions{
    flex: 0 0 auto;
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
    -webkit-overflow-scrolling: touch;
    overflow-x: auto;
    overflow-y: hidden;
    justify-content: flex-start;
    gap: 6px;
    padding: 0 0 2px;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    touch-action: pan-x;
  }

  .map-search{
    width: 100%;
  }

  .map-search-input-wrap{
    min-height: 38px;
    padding: 0 9px;
    gap: 6px;
    border-radius: 12px;
  }

  .map-search-icon{
    width: 16px;
    height: 16px;
  }

  .map-search-input{
    font-size: 12px;
  }

  .map-search-clear{
    width: 20px;
    height: 20px;
    font-size: 14px;
  }

  .map-search-results{
    max-height: min(260px, 34vh);
  }

  .toolbar-actions::-webkit-scrollbar{
    display: none;
  }

  .toolbar-btn{
    flex: 0 0 auto;
    min-height: 34px !important;
    padding: 7px 10px;
    border-radius: 12px;
    font-size: 11px;
    white-space: nowrap;
  }

  #feature-popup{
    position: fixed;
    top: auto;
    right: 0;
    left: 0;
    bottom: 0;
    height: 150px;
    max-height: calc(100% - 78px);
    width: auto;
    transform: translateY(calc(100% + 18px));
    transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), height 0.3s ease;
  }

  #feature-popup.open{ transform: translateY(0); }

  #feature-popup.expanded{
    height: min(70vh, 560px);
  }

  #feature-popup:not(.expanded) .popup-minirow,
  #feature-popup:not(.expanded) .popup-info-card{
    display: none;
  }

  #feature-popup .popup-shell{
    border-radius: 22px 22px 0 0;
    height: 100%;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  #feature-popup:not(.expanded) .popup-shell{
    overflow: hidden;
  }

  #feature-popup .popup-sublayer-card,
  #feature-popup .popup-header,
  #feature-popup .popup-minirow{
    flex-shrink: 0;
  }

  #layer-panel{
    left: 12px;
    bottom: 74px;
    width: min(296px, calc(100vw - 24px));
    max-height: calc(100vh - 170px);
    padding: 14px;
    transform: translateY(16px) scale(0.98);
    opacity: 0;
    pointer-events: none;
  }

  body.risala-mode #layer-panel{
    display: none;
  }

  body.risala-mode #layers-toggle-btn{
    display: inline-flex;
  }

  body.risala-mode #risala-mode-panel{
    left: 12px;
    bottom: 74px;
    width: min(296px, calc(100vw - 24px));
    max-height: calc(100vh - 170px);
    padding: 14px;
    transform: translateY(16px) scale(0.98);
    opacity: 0;
    pointer-events: none;
  }

  body.risala-mode.layers-risala-mobile-open #risala-mode-panel{
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: auto;
  }

  body.layers-mobile-open #layer-panel{
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: auto;
  }

  #layers-toggle-btn{
    left: 12px;
    bottom: 12px;
    min-width: 52px;
    height: 52px;
    padding: 0 14px;
    border-radius: 12px;
  }

  #layers-toggle-btn .toggle-text{ display: none; }
  #layers-toggle-btn .hamburger{ display: flex; }

  #boundaries-toggle-btn{
    min-height: 34px;
    padding: 7px 10px;
    font-size: 11px;
  }
}

@media (orientation: landscape) and (max-height: 600px) and (max-width: 1024px){
  #top-toolbar{
    top: 6px;
    left: 50%;
    right: auto;
    width: max-content;
    max-width: calc(100vw - 24px);
    transform: translateX(-50%);
  }

  .toolbar-cluster{
    width: auto;
    max-width: calc(100vw - 24px);
    align-items: stretch;
    box-sizing: border-box;
    gap: 5px;
    padding: 5px 7px;
  }

  .map-search{
    width: min(58vw, 360px);
  }

  .map-search-input-wrap{
    min-height: 32px;
    padding: 0 8px;
  }

  .map-search-input{
    font-size: 11px;
  }

  .map-search-icon{
    width: 14px;
    height: 14px;
  }

  .toolbar-actions{
    flex: 0 1 auto;
    width: auto;
    max-width: 100%;
    gap: 5px;
  }

  .toolbar-btn{
    min-height: 30px !important;
    padding: 5px 8px;
    font-size: 10px;
    gap: 5px;
  }

  .toolbar-btn .btn-icon{
    width: 15px;
    height: 15px;
  }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="loading-overlay">
  <div class="ld-parch" aria-hidden="true"></div>
  <svg class="ld-world" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="ld-fade" cx="50%" cy="50%" r="50%">
        <stop offset="55%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="ld-fadeMask"><rect x="-500" y="-500" width="1000" height="1000" fill="url(#ld-fade)"/></mask>
    </defs>
    <g mask="url(#ld-fadeMask)">
      <g id="ld-grat" class="ld-grat"></g>
      <g class="ld-route">
        <path d="M-420 180 C-300 60 -200 260 -80 120 S160 -40 260 70 400 -120 430 -200"/>
        <path d="M-380 -220 C-260 -300 -160 -120 -20 -190 S200 -310 330 -230"/>
      </g>
      <g id="ld-pins"></g>
    </g>
  </svg>
  <svg class="ld-astro" viewBox="-300 -300 600 600" aria-hidden="true">
    <g class="ld-ring ld-ring-outer" id="ld-ringOuter"><circle r="288"/><circle r="262"/></g>
    <g class="ld-ring ld-ring-mid" id="ld-ringMid"><circle r="226"/></g>
    <g class="ld-rose" id="ld-rose"></g>
  </svg>
  <div class="ld-corner ld-tl" id="ld-cTL"></div>
  <div class="ld-corner ld-tr" id="ld-cTR"></div>
  <div class="ld-corner ld-bl" id="ld-cBL"></div>
  <div class="ld-corner ld-br" id="ld-cBR"></div>
  <div class="ld-stage">
    <div class="ld-seal" aria-hidden="true">
      <svg viewBox="-50 -50 100 100">
        <circle r="46" class="ld-ring-s"/>
        <circle r="41" class="ld-ring-s thin"/>
        <g class="ld-ticks">
          <path d="M0-46V-38M46 0H38M0 46V38M-46 0H-38"/>
          <path d="M32.5-32.5L27-27M32.5 32.5L27 27M-32.5 32.5L-27 27M-32.5-32.5L-27-27" class="minor"/>
        </g>
        <g class="ld-card">
          <path d="M0-36L6 0L0 36L-6 0Z" class="ld-v"/>
          <path d="M-36 0L0-6L36 0L0 6Z" class="ld-h"/>
        </g>
        <g class="ld-needle">
          <path d="M0-30L5 0L-5 0Z" class="ld-n"/>
          <path d="M0 30L5 0L-5 0Z" class="ld-s"/>
        </g>
        <circle r="4" class="ld-c"/>
        <circle r="1.4" class="ld-dot"/>
      </svg>
    </div>
    <div class="ld-text" role="status">Loading Risala coordinates<span class="ld-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></div>
    <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
    <div class="ld-pct" id="ld-pct">0%</div>
  </div>
</div>

<div id="top-toolbar">
  <div class="toolbar-cluster">
    <div class="map-search" id="map-search">
      <div class="map-search-input-wrap">
        <svg class="map-search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <input class="map-search-input" id="map-search-input" type="search" placeholder="ابحث عن الموقع" autocomplete="off" aria-label="البحث عن موقع" disabled>
        <button class="map-search-clear" id="map-search-clear" type="button" aria-label="مسح البحث">×</button>
      </div>
      <div class="map-search-results" id="map-search-results" role="listbox"></div>
    </div>

    <div class="toolbar-brand">
      <span class="eyebrow"></span>
      <span class="title"></span>
    </div>

    <div class="toolbar-actions">
      <a class="toolbar-btn" id="old-maps-btn" href="MapSearch.html" title="فتح الخرائط القديمة">
        <span class="btn-text">الخرائط القديمة</span>
      </a>
      <button class="toolbar-btn" id="risala-mode-btn" type="button" aria-pressed="false" title="عرض RisalaCoordinates بخلفية بيضاء">
        <span class="btn-text">المواقع حسب الرسالة الشريفة</span>
      </button>
      <button class="toolbar-btn" id="measure-toggle-btn" type="button" aria-pressed="false" title="تشغيل القياس">
        <span class="btn-text">القياس</span>
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="presentation">
            <path d="M4 16.5 16.5 4a2.12 2.12 0 0 1 3 0l.5.5a2.12 2.12 0 0 1 0 3L7.5 20a2.12 2.12 0 0 1-3 0l-.5-.5a2.12 2.12 0 0 1 0-3Z"></path>
            <path d="m9 7 8 8"></path>
            <path d="m11.5 4.5 2 2"></path>
            <path d="m6.5 9.5 2 2"></path>
            <path d="m4.5 14.5 2 2"></path>
          </svg>
        </span>
      </button>

      <button class="toolbar-btn" id="boundaries-toggle-btn" type="button" aria-pressed="false" title="إظهار حدود الاقاليم">
        <span class="btn-text">إظهار حدود الاقاليم</span>
      </button>
    </div>
  </div>
</div>

<button id="layers-toggle-btn" type="button" aria-controls="layer-panel" aria-expanded="true" title="Toggle layers panel">
  <span class="toggle-text">إظهار الطبقات</span>
  <span class="hamburger" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </span>
</button>

<!-- LAYER CONTROL PANEL (populated dynamically once CSV is parsed) -->
<div id="layer-panel">
  <h3>Map Layers</h3>
  <div id="layer-tree"><!-- checkboxes injected by JS --></div>
</div>

<div id="risala-mode-panel" aria-label="RisalaCoordinates sublayers">
  <h3>RisalaCoordinates</h3>
  <div id="risala-mode-tree"><!-- checkboxes injected by JS --></div>
</div>

<!-- BOTTOM DIALOGUE BOX / CARD POPUP -->
<div id="feature-popup">
  <div class="popup-shell">
    <button class="popup-close" id="popup-close-btn" title="Close">✕</button>

    <div class="popup-sublayer-card" id="popup-sublayer-card">
      <p class="popup-sublayer" id="popup-sublayer">—</p>
    </div>

    <div class="popup-header">
      <p class="popup-name" id="popup-name">—</p>
    </div>

    <div class="popup-minirow">
      <div class="mini-card">
        <p class="mini-label" id="popup-lat-label">Latitude</p>
        <p class="mini-value" id="popup-lat">—</p>
      </div>
      <div class="mini-card">
        <p class="mini-label" id="popup-longorg-label">Original Longitude</p>
        <p class="mini-value" id="popup-longorg">—</p>
      </div>
    </div>

    <div class="popup-info-card">
      <p class="mini-label" id="popup-info-label">Information</p>
      <p id="popup-info">—</p>
    </div>
  </div>
</div>

<script src="loadingscene.js?v=1"></script>
<script src="graticules.js?v=2"></script>
<script src="boundaries.js?v=2"></script>
<script src="geoplaces-now.js?v=2"></script>
<script src="measure.js"></script>
<script src="الخطوط.js?v=3"></script>
<script src="app.js?v=14"></script>
</body>
</html>
