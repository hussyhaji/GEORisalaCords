<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Risala Coordinates Map</title>

<!-- ============================================================
     LIBRARIES
     OpenLayers v8 (map engine) + PapaParse (CSV parser), both CDN.
     ============================================================ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@8.2.0/ol.css">
<script src="https://cdn.jsdelivr.net/npm/ol@8.2.0/dist/ol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<!-- Font: Amiri for all UI and map labels -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS
   A soft pastel "card UI" palette: lavender / mint / blush,
   sitting on top of a dark satellite basemap for contrast.
   ============================================================ */
:root{
  --lavender:      #E7E2FB;
  --lavender-deep: #8B7FD1;
  --mint:          #D8F5E9;
  --mint-deep:     #4FAE8C;
  --blush:         #FDE2E7;
  --blush-deep:    #E2789A;
  --cream:         #FBF9F6;
  --ink:           #2E2A3D;
  --ink-soft:      #6B657F;
  --panel-bg:      rgba(251, 249, 246, 0.94);
  --radius-lg:     22px;
  --radius-md:     14px;
  --radius-sm:     10px;
  --shadow-soft:   0 12px 32px rgba(46, 42, 61, 0.18);
  --font-display:  'Amiri', serif;
  --font-body:     'Amiri', serif;
  --glass-bg:      rgba(255, 252, 247, 0.76);
  --glass-border:  rgba(255, 255, 255, 0.46);
  --toolbar-shadow: 0 20px 44px rgba(15, 23, 42, 0.22);
  --accent-teal:   #0F8B8D;
  --accent-gold:   #D4A017;
}

*{ box-sizing: border-box; }

html, body{
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  font-family: var(--font-body);
  color: var(--ink);
  overflow: hidden;
}

body::before{
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at top left, rgba(15,139,141,0.18), transparent 30%),
    radial-gradient(circle at top right, rgba(212,160,23,0.16), transparent 28%),
    linear-gradient(180deg, rgba(255,255,255,0.05), transparent 26%);
  pointer-events: none;
  z-index: 1;
}

body.risala-mode::before{
  background: #ffffff;
}

#map{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #0d1117;
  z-index: 2;
  pointer-events: auto;
}

#top-toolbar,
#layer-panel,
#risala-mode-panel,
#layers-toggle-btn,
#feature-popup{
  z-index: 30;
}

/* Cursor states driven by JS: default vs pointer-over-feature */
#map.feature-hover{ cursor: pointer; }

/* ============================================================
   LOADING OVERLAY (shown while CSV is fetched / parsed)
   ============================================================ */
#loading-overlay{
  position: absolute;
  inset: 0;
  background: var(--ink);
  color: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
  font-family: var(--font-display);
  z-index: 50;
  transition: opacity 0.4s ease;
}
#loading-overlay.hidden{ opacity: 0; pointer-events: none; }
.spinner{
  width: 34px; height: 34px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top-color: var(--lavender);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ============================================================
   TOP TOOLBAR
   ============================================================ */
#top-toolbar{
  position: absolute;
  top: 20px;
  left: 20px;
  right: 20px;
  z-index: 26;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  pointer-events: none;
}

#top-toolbar:has(.map-search-results.open){
  z-index: 35;
}

.toolbar-cluster{
  pointer-events: auto;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  background: var(--glass-bg);
  backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  box-shadow: var(--toolbar-shadow);
}

.map-search{
  position: relative;
  width: min(100%, 460px);
  direction: rtl;
}

.map-search-input-wrap{
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding: 0 13px;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(46, 42, 61, 0.1);
  border-radius: 15px;
  box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.map-search:focus-within .map-search-input-wrap{
  border-color: rgba(15, 139, 141, 0.55);
  box-shadow: 0 10px 24px rgba(15, 139, 141, 0.16);
}

.map-search-icon{
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  color: var(--accent-teal);
}

.map-search-input{
  min-width: 0;
  flex: 1 1 auto;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: 700 14px var(--font-body);
  text-align: right;
}

.map-search-input::placeholder{ color: var(--ink-soft); }
.map-search-input:disabled{ cursor: wait; opacity: 0.55; }

.map-search-clear{
  display: none;
  border: 0;
  padding: 0;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--lavender);
  color: var(--ink-soft);
  font: 16px/1 var(--font-body);
  cursor: pointer;
}

.map-search.has-value .map-search-clear{ display: inline-flex; align-items: center; justify-content: center; }

.map-search-results{
  position: absolute;
  top: calc(100% + 7px);
  left: 0;
  right: 0;
  display: none;
  max-height: 260px;
  overflow-y: auto;
  padding: 6px;
  background: rgba(255, 252, 247, 0.98);
  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 14px;
  box-shadow: 0 16px 34px rgba(15, 23, 42, 0.22);
  z-index: 40;
}

.map-search-results.open{ display: block; }

.map-search-option{
  display: block;
  width: 100%;
  padding: 9px 11px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--ink);
  font: 700 14px var(--font-body);
  text-align: right;
  cursor: pointer;
}

.map-search-option:hover,
.map-search-option:focus-visible{ background: var(--lavender); outline: 0; }

.map-search-empty{
  padding: 10px 11px;
  color: var(--ink-soft);
  font-size: 13px;
  text-align: right;
}

.toolbar-brand{
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.toolbar-brand .eyebrow{
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(46, 42, 61, 0.62);
}

.toolbar-brand .title{
  font-family: var(--font-display);
  font-size: 19px;
  line-height: 1;
  color: var(--ink);
  white-space: nowrap;
}

.toolbar-actions{
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.toolbar-btn{
  border: none;
  border-radius: 16px;
  padding: 11px 16px;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  direction: rtl;
  text-align: right;
  transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease, color 0.22s ease;
}

.toolbar-btn .btn-icon{
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.toolbar-btn .btn-icon svg{
  width: 100%;
  height: 100%;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.85;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.toolbar-btn:hover{
  transform: translateY(-1px);
}

#measure-toggle-btn{
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(231,226,251,0.96));
  color: var(--ink);
  box-shadow: inset 0 0 0 1px rgba(139,127,209,0.1);
  min-height: 44px;
}

#risala-mode-btn{
  background: linear-gradient(135deg, #0F8B8D, #126E82);
  color: #fff;
  box-shadow: 0 8px 18px rgba(15, 139, 141, 0.24);
  min-height: 44px;
}

#risala-mode-btn.is-active{
  background: linear-gradient(135deg, #D4A017, #B87914);
}

#measure-toggle-btn.is-active{
  background: linear-gradient(135deg, rgba(139,127,209,0.96), rgba(15,139,141,0.92));
  color: #fff;
}

.measure-tooltip{
  padding: 7px 10px;
  border-radius: 10px;
  background: rgba(255, 252, 247, 0.96);
  color: var(--ink);
  box-shadow: 0 10px 22px rgba(15, 23, 42, 0.18);
  border: 1px solid rgba(255,255,255,0.6);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 700;
  direction: ltr;
  white-space: normal;
  line-height: 1.3;
  backdrop-filter: blur(14px);
}

.measure-tooltip-line{
  display: flex;
  align-items: baseline;
  justify-content: flex-start;
  gap: 4px;
}

.measure-tooltip-line + .measure-tooltip-line{
  margin-top: 2px;
}

.measure-tooltip-label{
  color: var(--ink-soft);
  flex-shrink: 0;
}

.measure-tooltip-values{
  text-align: left;
  direction: ltr;
}

/* ============================================================
   LAYER CONTROL PANEL — floating, top-right
   ============================================================ */
#layer-panel{
  position: absolute;
  left: 20px;
  bottom: 86px;
  width: 300px;
  max-height: calc(100vh - 180px);
  overflow-y: auto;
  background: rgba(251, 249, 246, 0.94);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.48);
  border-radius: var(--radius-lg);
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.22);
  padding: 18px 18px 14px;
  z-index: 20;
  font-family: var(--font-body);
  transition: transform 0.28s ease, opacity 0.28s ease;
}
#layer-panel h3{
  margin: 0 0 12px;
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}
#layer-panel h3::before{
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--lavender-deep);
  display: inline-block;
}
#risala-mode-panel{
  position: absolute;
  top: auto;
  bottom: 20px;
  left: 20px;
  width: 238px;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(15, 139, 141, 0.16);
  border-radius: 16px;
  box-shadow: 0 18px 42px rgba(15, 23, 42, 0.18);
  padding: 14px;
  z-index: 20;
  opacity: 0;
  transform: translateY(-8px) scale(0.98);
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
body.risala-mode #risala-mode-panel{
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
body.risala-mode #layers-toggle-btn{
  display: none;
}
body.risala-mode #layer-tree .geo-places-now-group{
  display: none;
}
#risala-mode-panel h3{
  margin: 0 0 8px;
  color: var(--ink);
  font-size: 15px;
}
.layer-row{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  font-size: 13.5px;
}
.layer-group + .layer-group{ margin-top: 4px; }
.layer-row.parent{
  font-weight: 600;
  border-top: 1px solid rgba(46,42,61,0.08);
  margin-top: 6px;
  padding-top: 10px;
}
.layer-row.child{
  padding-left: 22px;
  color: var(--ink-soft);
}
.layer-row.has-children label{ flex: 1; }
.group-collapse-btn{
  border: none;
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--font-body);
  font-size: 12px;
  width: 20px;
  height: 20px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.group-collapse-btn:hover{ background: rgba(139,127,209,0.16); color: var(--ink); }
.layer-group-children{ overflow: hidden; }
.layer-group.collapsed .layer-group-children{ display: none; }
.layer-row input[type="checkbox"]{
  accent-color: var(--lavender-deep);
  width: 16px; height: 16px;
  cursor: pointer;
  flex-shrink: 0;
}
.layer-row .swatch{
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid rgba(0,0,0,0.15);
}
.layer-row label{ cursor: default; user-select: none; }

/* ============================================================
   RIGHT DIALOGUE BOX — sliding "card UI" popup
   ============================================================ */
#feature-popup{
  position: absolute;
  top: 24px;
  right: 24px;
  bottom: 24px;
  width: min(460px, 34vw);
  transform: translateX(calc(100% + 32px));
  transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 30;
  pointer-events: none;
}
#feature-popup.open{
  transform: translateX(0);
  pointer-events: auto;
}

.popup-shell{
  background: var(--cream);
  border-radius: var(--radius-lg);
  box-shadow: 0 24px 48px rgba(15, 23, 42, 0.24);
  padding: 18px 18px 16px;
  position: relative;
  direction: rtl;
  text-align: right;
  height: 100%;
  display: flex;
  flex-direction: column;
  border: 1px solid rgba(255,255,255,0.62);
}

.popup-close{
  position: absolute;
  top: 12px;
  right: 12px;
  width: 28px; height: 28px;
  border-radius: 50%;
  border: none;
  background: var(--blush);
  color: var(--blush-deep);
  font-size: 15px;
  font-family: var(--font-body);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease, background 0.15s ease;
}
.popup-close:hover{ transform: scale(1.1); background: var(--blush-deep); color: #fff; }

/* Small SubLayer chip card (color set from selected layer) */
.popup-sublayer-card{
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  color: #ffffff;
  box-shadow: 0 6px 16px rgba(46, 42, 61, 0.18);
}

.popup-sublayer-card .popup-sublayer{
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 0;
  color: inherit;
  align-self: center;
}

/* Header card: Name (prominent) */
.popup-header{
  background: var(--lavender);
  border-radius: var(--radius-md);
  padding: 12px 46px 14px 16px;
  margin-bottom: 12px;
  border-left: 6px solid var(--lavender-deep);
}
.popup-header .popup-name{
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--ink);
  margin: 0 0 2px;
  line-height: 1.2;
  text-align: center;
}
.popup-header .popup-sublayer{
  display: none;
}

/* Middle row: 3 equal mini-cards */
.popup-minirow{
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
.mini-card{
  flex: 1 1 50%;
  background: var(--mint);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  min-width: 0;
}
.mini-card:nth-child(2){ background: var(--lavender); }
.mini-card .mini-label{
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
  color: var(--ink-soft);
  margin: 0 0 4px;
}
.mini-card .mini-value{
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink);
  margin: 0;
  overflow-wrap: break-word;
  font-family: var(--font-body);
}

/* Bottom row: wide Information card */
.popup-info-card{
  background: #fff;
  border: 1px solid rgba(46,42,61,0.08);
  border-radius: var(--radius-md);
  padding: 16px 18px;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.popup-info-card .mini-label{
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
  color: var(--ink-soft);
  margin: 0 0 6px;
}
.popup-info-card p{
  margin: 0;
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink);
  min-height: 0;
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

/* Scrollbar polish for panel & popup */
#layer-panel::-webkit-scrollbar, .popup-info-card p::-webkit-scrollbar{ width: 6px; }
#layer-panel::-webkit-scrollbar-thumb, .popup-info-card p::-webkit-scrollbar-thumb{
  background: var(--lavender-deep); border-radius: 4px;
}

/* Layers toggle button (desktop text, mobile hamburger) */
#layers-toggle-btn{
  position: absolute;
  left: 20px;
  bottom: 20px;
  z-index: 25;
  border: none;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.96);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 700;
  padding: 12px 14px;
  box-shadow: 0 12px 26px rgba(15, 23, 42, 0.24);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 132px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

#layers-toggle-btn:hover{
  transform: translateY(-1px);
  box-shadow: 0 16px 30px rgba(15, 23, 42, 0.28);
}

#layers-toggle-btn .hamburger{
  display: none;
  width: 16px;
  height: 12px;
  flex-direction: column;
  justify-content: space-between;
}

#layers-toggle-btn .hamburger span{
  width: 100%;
  height: 2px;
  border-radius: 2px;
  background: var(--ink);
  display: block;
}

/* Climate boundaries toggle inside toolbar */
#boundaries-toggle-btn{
  position: static;
  z-index: auto;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(216,245,233,0.96));
  color: var(--ink);
  box-shadow: inset 0 0 0 1px rgba(15,139,141,0.08);
  min-height: 44px;
}

#boundaries-toggle-btn::before{
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent-teal);
  box-shadow: 0 0 0 0 rgba(79,174,140,0.45);
  transition: background 0.25s ease, box-shadow 0.4s ease;
}

#boundaries-toggle-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 16px 36px rgba(15, 23, 42, 0.22);
}

#boundaries-toggle-btn.is-active{
  background: linear-gradient(135deg, rgba(15,139,141,0.96), rgba(212,160,23,0.92));
  color: #fff;
}

#boundaries-toggle-btn.is-active::before{
  background: #ffffff;
  box-shadow: 0 0 0 8px rgba(255,255,255,0.2);
}

body.layers-hidden #layer-panel{
  transform: translateY(16px) scale(0.98);
  opacity: 0;
  pointer-events: none;
}

@media (max-width: 640px), (max-height: 600px) and (max-width: 1024px){
  .popup-minirow{
    flex-direction: row;
    gap: 8px;
  }
}

@media (max-width: 768px), (max-height: 600px) and (max-width: 1024px){
  html,
  body{
    overscroll-behavior: none;
  }

  #map,
  #map .ol-viewport{
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }

  #map *::selection{
    background: transparent;
  }

  #top-toolbar{
    top: 14px;
    left: 12px;
    right: 12px;
    transform: none;
    align-items: stretch;
  }

  .toolbar-cluster{
    width: 100%;
    justify-content: flex-start;
    gap: 7px;
    padding: 7px 8px;
  }

  .toolbar-brand{ display: none; }

  .toolbar-brand .eyebrow{ display: none; }
  .toolbar-brand .title{ font-size: 17px; }

  .toolbar-actions{
    flex: 1 1 auto;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    justify-content: flex-start;
    gap: 6px;
    padding: 0 0 2px;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    touch-action: pan-x;
  }

  .map-search{
    width: 100%;
  }

  .map-search-input-wrap{
    min-height: 38px;
    padding: 0 9px;
    gap: 6px;
    border-radius: 12px;
  }

  .map-search-icon{
    width: 16px;
    height: 16px;
  }

  .map-search-input{
    font-size: 12px;
  }

  .map-search-clear{
    width: 20px;
    height: 20px;
    font-size: 14px;
  }

  .map-search-results{
    max-height: min(260px, 34vh);
  }

  .toolbar-actions::-webkit-scrollbar{
    display: none;
  }

  .toolbar-btn{
    flex: 0 0 auto;
    min-height: 34px !important;
    padding: 7px 10px;
    border-radius: 12px;
    font-size: 11px;
    white-space: nowrap;
  }

  #feature-popup{
    position: fixed;
    top: auto;
    right: 0;
    left: 0;
    bottom: 0;
    height: 150px;
    max-height: calc(100% - 78px);
    width: auto;
    transform: translateY(calc(100% + 18px));
    transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), height 0.3s ease;
  }

  #feature-popup.open{ transform: translateY(0); }

  #feature-popup.expanded{
    height: min(70vh, 560px);
  }

  #feature-popup:not(.expanded) .popup-minirow,
  #feature-popup:not(.expanded) .popup-info-card{
    display: none;
  }

  #feature-popup .popup-shell{
    border-radius: 22px 22px 0 0;
    height: 100%;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
  }

  #feature-popup:not(.expanded) .popup-shell{
    overflow: hidden;
  }

  #feature-popup .popup-sublayer-card,
  #feature-popup .popup-header,
  #feature-popup .popup-minirow{
    flex-shrink: 0;
  }

  #layer-panel{
    left: 12px;
    bottom: 74px;
    width: min(296px, calc(100vw - 24px));
    max-height: calc(100vh - 170px);
    padding: 14px;
    transform: translateY(16px) scale(0.98);
    opacity: 0;
    pointer-events: none;
  }

  body.risala-mode #layer-panel{
    display: none;
  }

  body.risala-mode #layers-toggle-btn{
    display: inline-flex;
  }

  body.risala-mode #risala-mode-panel{
    left: 12px;
    bottom: 74px;
    width: min(296px, calc(100vw - 24px));
    max-height: calc(100vh - 170px);
    padding: 14px;
    transform: translateY(16px) scale(0.98);
    opacity: 0;
    pointer-events: none;
  }

  body.risala-mode.layers-risala-mobile-open #risala-mode-panel{
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: auto;
  }

  body.layers-mobile-open #layer-panel{
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: auto;
  }

  #layers-toggle-btn{
    left: 12px;
    bottom: 12px;
    min-width: 52px;
    height: 52px;
    padding: 0 14px;
    border-radius: 12px;
  }

  #layers-toggle-btn .toggle-text{ display: none; }
  #layers-toggle-btn .hamburger{ display: flex; }

  #boundaries-toggle-btn{
    min-height: 34px;
    padding: 7px 10px;
    font-size: 11px;
  }
}

@media (orientation: landscape) and (max-height: 600px) and (max-width: 1024px){
  #top-toolbar{
    top: 6px;
    left: 50%;
    right: auto;
    width: max-content;
    max-width: calc(100vw - 24px);
    transform: translateX(-50%);
  }

  .toolbar-cluster{
    width: auto;
    max-width: calc(100vw - 24px);
    gap: 5px;
    padding: 5px 7px;
  }

  .map-search{
    width: min(58vw, 360px);
  }

  .map-search-input-wrap{
    min-height: 32px;
    padding: 0 8px;
  }

  .map-search-input{
    font-size: 11px;
  }

  .map-search-icon{
    width: 14px;
    height: 14px;
  }

  .toolbar-actions{
    flex: 0 1 auto;
    width: auto;
    max-width: calc(100vw - 28px);
    gap: 5px;
  }

  .toolbar-btn{
    min-height: 30px !important;
    padding: 5px 8px;
    font-size: 10px;
    gap: 5px;
  }

  .toolbar-btn .btn-icon{
    width: 15px;
    height: 15px;
  }
}
</style>
</head>
<body>

<div id="map"></div>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div>Loading Risala coordinates…</div>
</div>

<div id="top-toolbar">
  <div class="toolbar-cluster">
    <div class="map-search" id="map-search">
      <div class="map-search-input-wrap">
        <svg class="map-search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="m16 16 5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <input class="map-search-input" id="map-search-input" type="search" placeholder="ابحث عن الموقع" autocomplete="off" aria-label="البحث عن موقع" disabled>
        <button class="map-search-clear" id="map-search-clear" type="button" aria-label="مسح البحث">×</button>
      </div>
      <div class="map-search-results" id="map-search-results" role="listbox"></div>
    </div>

    <div class="toolbar-brand">
      <span class="eyebrow"></span>
      <span class="title"></span>
    </div>

    <div class="toolbar-actions">
      <button class="toolbar-btn" id="risala-mode-btn" type="button" aria-pressed="false" title="عرض RisalaCoordinates بخلفية بيضاء">
        <span class="btn-text">المواقع حسب الرسالة الشريفة</span>
      </button>
      <button class="toolbar-btn" id="measure-toggle-btn" type="button" aria-pressed="false" title="تشغيل القياس">
        <span class="btn-text">القياس</span>
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="presentation">
            <path d="M4 16.5 16.5 4a2.12 2.12 0 0 1 3 0l.5.5a2.12 2.12 0 0 1 0 3L7.5 20a2.12 2.12 0 0 1-3 0l-.5-.5a2.12 2.12 0 0 1 0-3Z"></path>
            <path d="m9 7 8 8"></path>
            <path d="m11.5 4.5 2 2"></path>
            <path d="m6.5 9.5 2 2"></path>
            <path d="m4.5 14.5 2 2"></path>
          </svg>
        </span>
      </button>

      <button class="toolbar-btn" id="boundaries-toggle-btn" type="button" aria-pressed="false" title="إظهار حدود الاقاليم">
        <span class="btn-text">إظهار حدود الاقاليم</span>
      </button>
    </div>
  </div>
</div>

<button id="layers-toggle-btn" type="button" aria-controls="layer-panel" aria-expanded="true" title="Toggle layers panel">
  <span class="toggle-text">إظهار الطبقات</span>
  <span class="hamburger" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </span>
</button>

<!-- LAYER CONTROL PANEL (populated dynamically once CSV is parsed) -->
<div id="layer-panel">
  <h3>Map Layers</h3>
  <div id="layer-tree"><!-- checkboxes injected by JS --></div>
</div>

<div id="risala-mode-panel" aria-label="RisalaCoordinates sublayers">
  <h3>RisalaCoordinates</h3>
  <div id="risala-mode-tree"><!-- checkboxes injected by JS --></div>
</div>

<!-- BOTTOM DIALOGUE BOX / CARD POPUP -->
<div id="feature-popup">
  <div class="popup-shell">
    <button class="popup-close" id="popup-close-btn" title="Close">✕</button>

    <div class="popup-sublayer-card" id="popup-sublayer-card">
      <p class="popup-sublayer" id="popup-sublayer">—</p>
    </div>

    <div class="popup-header">
      <p class="popup-name" id="popup-name">—</p>
    </div>

    <div class="popup-minirow">
      <div class="mini-card">
        <p class="mini-label" id="popup-lat-label">Latitude</p>
        <p class="mini-value" id="popup-lat">—</p>
      </div>
      <div class="mini-card">
        <p class="mini-label" id="popup-longorg-label">Original Longitude</p>
        <p class="mini-value" id="popup-longorg">—</p>
      </div>
    </div>

    <div class="popup-info-card">
      <p class="mini-label" id="popup-info-label">Information</p>
      <p id="popup-info">—</p>
    </div>
  </div>
</div>

<script src="graticules.js?v=2"></script>
<script src="boundaries.js?v=2"></script>
<script src="geoplaces-now.js?v=2"></script>
<script src="measure.js"></script>
<script src="الخطوط.js?v=3"></script>
<script src="app.js?v=8"></script>
</body>
</html>
